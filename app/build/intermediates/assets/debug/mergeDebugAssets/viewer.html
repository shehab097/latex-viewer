<script>
const A='((?:[^{}]|\\{(?:[^{}]|\\{[^{}]*\\})*\\})*)';

}
function imgStyle(o){

function fitImages(){

  img.addEventListener('error',()=>{
   const bases=(img.getAttribute('data-srcs')||'').split('\n').filter(Boolean);
   const exts=(img.getAttribute('data-exts')||'').split(',').filter(Boolean);
   const all=[];
   if(exts.length){
    bases.forEach(b=>exts.forEach(e=>all.push(b+'.'+e)));
    bases.forEach(b=>all.push(b));
   }else{
    bases.forEach(b=>all.push(b));
   }
   let n=parseInt(img.getAttribute('data-ci')||'-1',10)+1;
   if(n<all.length){
    img.setAttribute('data-ci',n);
    img.src=all[n];
    return;
   }
   const ph=document.createElement('div');
   ph.className='ph';
   ph.textContent='Image: '+(img.getAttribute('data-name')||bases[0]||'?');
   img.replaceWith(ph);
  });

}
function splitRows(b){const r=[];let d=0,last=0,m;const re=/\\begin\{|\\end\{|\\\\/g;

function md(src){
 src=src.replace(/^---\n[\s\S]*?\n---\n/,'');const C=[];

function fitMath(){
 document.querySelectorAll('.dm').forEach(d=>{
  const k=d.querySelector('.katex');if(!k)return;
  k.style.fontSize='';
  const box=k.parentElement,avail=d.clientWidth;
  if(!avail)return;
  let size=parseFloat(getComputedStyle(k).fontSize)||17;
  const min=size*0.55;let guard=0;
  const over=()=>Math.max(d.scrollWidth-d.clientWidth,box?box.scrollWidth-box.clientWidth:0)>1;
  while(over()&&size>min&&guard++<32){
   size=Math.max(min,size-0.5);
   k.style.fontSize=size+'px';
  }
  d.classList.toggle('over',over());
 });
}
function tikzLoader(){
 if(!TIKZ_LOADER&&typeof TikZJax!=='undefined'&&TikZJax.getResourceLoader){
  try{TIKZ_LOADER=TikZJax.getResourceLoader({texResourcesUrl:'https://tikzjax.local/tex'})}catch(e){}
 }
 return TIKZ_LOADER;
}
async function renderTikz(gen){
 const nodes=document.querySelectorAll('.tikz[data-tikz-id]');
 if(!nodes.length)return;
 if(typeof TikZJax==='undefined'||typeof TikZJax.tex!=='function'){
  nodes.forEach(n=>{n.innerHTML='<span class="ph">TikZ drawing (not rendered)</span>'});
  return;
 }
 const loader=tikzLoader();
 const libs=TIKZ_LIBS;
 const pkgs=Object.assign({},TIKZ_PACKAGES);
 for(const n of nodes){
  if(gen!==RENDER_GEN)return;
  const id=parseInt(n.getAttribute('data-tikz-id')||'-1',10);
  const code=TIKZ[id];
  if(!code){n.innerHTML='<span class="ph">TikZ drawing (not rendered)</span>';continue}
  try{
   const dvi=await TikZJax.tex('\\begin{document}\n'+code+'\n\\end{document}',{tikzLibraries:libs,texPackages:pkgs,showConsole:false},loader);
   if(gen!==RENDER_GEN)return;
   const svg=await TikZJax.dvi2svg(dvi,{disableSanitize:true,embedFontCss:false});
   if(gen!==RENDER_GEN)return;
   n.innerHTML=svg;
   n.classList.add('tikz-done');
  }catch(e){
   if(gen!==RENDER_GEN)return;
   n.innerHTML='<span class="ph">TikZ drawing could not be rendered</span>';
   n.title=String(e&&e.message?e.message:e);
   if(typeof console!=='undefined')console.error('TikZ render failed',e);
  }
 }
}
function render(src,isMd){
 M=[];LAB={};EQ=0;FNT=[];GP=[];TIKZ=[];TIKZ_LIBS='';TIKZ_PACKAGES={};MAC=Object.assign({},BASE);
 const gen=++RENDER_GEN;
 src=String(src==null?'':src).replace(/\r/g,'');
 let h;
 try{ h=isMd?md(src):latex(src); }
 catch(e){ showError('Could not render this document',e&&e.message?e.message:String(e)); return }
 for(let i=0;i<6;i++){const n=h.replace(RS,(_,k)=>M[k]||'');if(n===h)break;h=n}
 h=h.replace(/\u0002([er]):([^\u0002]*)\u0002/g,(_,k,key)=>LAB[key]!=null?(k==='e'?'('+LAB[key]+')':LAB[key]):'?');
 document.getElementById('c').innerHTML=h;
 window.scrollTo(0,0);
 fitImages();
 fitMath();
 renderTikz(gen);
}
function showError(message,detail){
 const d=detail?'<pre>'+esc(detail)+'</pre>':'';
 document.getElementById('c').innerHTML='<div class="err"><div class="ico">\u26A0</div><h2>Cannot open this document</h2><p>'+esc(message||'')+'</p>'+d+'</div>';
 window.scrollTo(0,0);
}
function setup(theme,font,scale){
 document.documentElement.className=theme||'light';
 document.body.className=(theme||'light')+' '+(font||'serif');
 document.documentElement.style.fontSize=(17*(scale||100)/100)+'px';
 fitMath();
}

(function init(){
